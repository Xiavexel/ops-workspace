# 不要任何全局镜像，不要任何手动指定的 tag，不要关闭 Webhook

grafana:
  service:
    type: NodePort
    nodePort: 30091
  persistence:
    enabled: false

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    # 【新增】配置安全上下文，强制赋予写权限
    securityContext:
      fsGroup: 65534
      runAsUser: 65534
      runAsNonRoot: true
      
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  service:
    type: NodePort
    nodePort: 30092