server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    location /health {
        # 【修复】原写法是 return 200 "OK 换行 "; —— 字符串里带真实换行，
        # nginx 启动时直接报 unexpected end of file，镜像里的配置根本没生效。
        # 另外 return 之后 add_header 不会被执行，MIME 类型要用 default_type 指定。
        default_type text/plain;
        return 200 "OK\n";
    }
}
