services:
  # ========== 前端：Nginx ==========
  web:
    build: ./web
    container_name: stack-web
    ports:
      - "8095:80"
    networks:
      - frontend
    depends_on:
      api:
        # 等 api "健康"再启动，而不是"容器起来"就启动
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ========== 后端：Flask ==========
  api:
    build: ./api
    container_name: stack-api
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      # python:3.12-slim 里没有 curl，用 python 自己探 /health
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========== 数据库：MySQL ==========
  db:
    image: mysql:8.0
    container_name: stack-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      # $$ 是 compose 的转义：交给容器内的 shell 展开，而不是 compose 自己展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# ========== 网络 ==========
networks:
  frontend:
  backend:

# ========== 数据卷 ==========
volumes:
  db-data:
