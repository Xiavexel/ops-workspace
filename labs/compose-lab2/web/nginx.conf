server {
    listen 80;
    server_name localhost;

    # 静态首页
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 反向代理到 API 服务
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
